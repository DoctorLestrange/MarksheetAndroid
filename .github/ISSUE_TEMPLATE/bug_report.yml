name: Bug Report
description: Report a bug, calculation error, or UI issue in Marksheet
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behavior.
      placeholder: |
        1. Set marking scheme to ...
        2. Tap ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device & Android Version
      placeholder: "e.g., Pixel 8, Android 15 (API 35)"
    validations:
      required: false

  - type: dropdown
    id: theme
    attributes:
      label: Active Theme
      options:
        - Warm Paper Light
        - Graphite Dark
        - Pure AMOLED Black
    validations:
      required: false
